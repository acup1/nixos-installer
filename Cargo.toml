[package]
name = "nixos-installer"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Terminal installer and module configurator for NixOS"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminalib = { git = "https://github.com/acup1/terminalib", rev = "4de9f8ee9c15eecea58a2936c13eacc190b61ca7" }
