name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, system: x86_64-linux, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux, target: aarch64-unknown-linux-musl }
          - { runner: macos-15, system: aarch64-darwin, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, system: x86_64-darwin, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release launcher
        run: sh tests/bootstrap.sh
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Enable selector integration tests with Nix
        if: matrix.system == 'x86_64-linux'
        run: |
          sudo apt-get install -y nix-bin
          # The local flake fixture needs a store for its source snapshot.
          selector_store="local?root=$RUNNER_TEMP/nix-selector-store"
          echo "NIX_REMOTE=$selector_store" >> "$GITHUB_ENV"
          NIX_REMOTE="$selector_store" nix --extra-experimental-features 'nix-command flakes' eval --raw --expr '"Nix evaluator ready"'
      - name: Test installer
        shell: bash
        run: |
          log="$RUNNER_TEMP/installer-tests.log"
          if ! cargo test --locked --target "${{ matrix.target }}" >"$log" 2>&1; then
            cat "$log"
            sed -n '/^failures:/,/^test result:/p' "$log" | while IFS= read -r line; do
              if [[ -n "$line" ]]; then printf '::error::%s\n' "${line//'%'/'%25'}"; fi
            done
            exit 1
          fi
          cat "$log"
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Check and stage executable
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/nixos-installer
          "$bin" --version
          mkdir -p dist
          cp "$bin" dist/nixos-installer-${{ matrix.system }}
      - uses: actions/upload-artifact@v4
        with:
          name: nixos-installer-${{ matrix.system }}
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish binaries and SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          grep -Fx "release='$GITHUB_REF_NAME'" bootstrap.sh
          cp bootstrap.sh dist/
          sh -n dist/bootstrap.sh
          (cd dist && sha256sum bootstrap.sh nixos-installer-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
