name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, system: x86_64-linux, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux, target: aarch64-unknown-linux-musl }
          - { runner: macos-15, system: aarch64-darwin, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, system: x86_64-darwin, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --target "${{ matrix.target }}"
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Check and stage executable
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/nixos-installer
          "$bin" --version
          mkdir -p dist
          cp "$bin" dist/nixos-installer-${{ matrix.system }}
      - uses: actions/upload-artifact@v4
        with:
          name: nixos-installer-${{ matrix.system }}
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish binaries and SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          (cd dist && sha256sum nixos-installer-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
